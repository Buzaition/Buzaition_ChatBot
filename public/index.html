<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buzaition Bot</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo-banner" aria-label="Buzaition Bot">
        <img class="logo-main" src="/assets/buzaition-logo-1.png" alt="Buzaition Bot" />
        <img class="logo-alt" src="/assets/buzaition-logo-2.png" alt="" aria-hidden="true" />
      </div>

      <button class="new-chat" id="newChatButton" type="button">
        <span>+</span>
        New chat
      </button>

      <nav class="chat-list" id="chatList" aria-label="Saved chats"></nav>
    </aside>

    <main class="chat-panel">
      <header class="topbar">
        <div>
          <p class="eyebrow">Buzaition Chatbot</p>
          <h2 id="chatTitle">New chat</h2>
        </div>
        <div class="topbar-actions">
          <div class="theme-toggle" aria-label="Theme">
            <button class="theme-button" type="button" data-theme="light" aria-pressed="true">Light</button>
            <button class="theme-button" type="button" data-theme="dark" aria-pressed="false">Dark</button>
            <button class="theme-button" type="button" data-theme="buz" aria-pressed="false">Buz</button>
          </div>
          <div class="status-pill" id="statusPill">Checking</div>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <form class="composer" id="chatForm">
        <textarea id="messageInput" rows="1" placeholder="Message the AI..." autocomplete="off"></textarea>
        <button id="sendButton" type="submit" aria-label="Send message">
          <span>Send</span>
        </button>
      </form>
    </main>
  </div>

  <template id="messageTemplate">
    <article class="message">
      <div class="avatar"></div>
      <div class="message-content">
        <div class="bubble"></div>
        <button class="copy-message" type="button" aria-label="Copy message" title="Copy message">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <rect x="9" y="9" width="11" height="11" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </div>
    </article>
  </template>

  <div class="message-menu" id="messageMenu" hidden>
    <button type="button" data-action="edit">Edit</button>
    <button type="button" data-action="delete">Delete</button>
  </div>

  <script src="/app.js" type="module"></script>
</body>

</html>
